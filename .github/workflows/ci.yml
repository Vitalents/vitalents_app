# WP-09: checks on every push and pull request. The assistant service is never started here:
# the app build uses VITE_ASSISTANT_MODE=cached, the ai job runs its unit tests only.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (types, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VITE_ASSISTANT_MODE: cached
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit and engine tests (Vitest)
        run: npx vitest run --exclude "e2e/**"
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright against vite preview)
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_SKIP_BUILD: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  science:
    name: Science and data checks (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: science/requirements.txt
      - run: pip install -r science/requirements.txt pytest
      - name: Science, research and fixture regression tests
        run: pytest -q science scripts/tests research/tests
      - name: Validate data against contracts/
        run: python scripts/validate_data.py
      - name: Validate rule provenance
        run: python scripts/check_rules.py
      - name: Forbidden wording check
        run: python scripts/check_language.py

  ai:
    name: Assistant tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-dev.txt
      - run: pip install -r ai/requirements.txt -r ai/requirements-dev.txt
      - name: Assistant unit tests
        working-directory: ai
        run: python -m pytest -q
